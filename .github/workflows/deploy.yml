name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project ZIP
        run: |
          set -euo pipefail

          rm -f deploy.zip

          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".next/*" \
            -x "tmp/*" \
            -x "*.zip"

          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -eo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_PATH is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "deploy.zip not found"
              exit 1
            fi

            APP_HOME="$(dirname "$APP_DIR")"
            APP_NAME="$(basename "$APP_DIR")"