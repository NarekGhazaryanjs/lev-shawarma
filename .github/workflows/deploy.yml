name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20"
          cache: npm

      - name: Install and build on CI
        run: |
          cp .env.example .env
          npm ci
          npx prisma generate
          npm run build

      - name: Create project ZIP (with .next, no node_modules)
        run: |
          rm -f deploy.zip
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env" \
            -x "dev.db" \
            -x "dev.db-*" \
            -x "*.zip" \
            -x ".next/cache/*"
          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Unzip, install runtime deps, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"
            STAGE="$APP_DIR/.deploy-staging"

            if [ -z "$APP_DIR" ] || [ ! -f "$ZIP_PATH" ]; then
              echo "Missing DEPLOY_PATH or ZIP"
              exit 1
            fi

            mkdir -p "$APP_DIR" "$APP_DIR/tmp" "$APP_DIR/public/uploads"
            cd "$APP_DIR"
            chmod -R u+rwX "$APP_DIR" 2>/dev/null || true

            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            unzip -o "$ZIP_PATH" -d "$STAGE"

            if [ -f .env ]; then cp .env /tmp/lev-env.backup; fi
            if [ -f dev.db ]; then cp dev.db /tmp/lev-db.backup; fi

            rm -rf src scripts prisma server.js package.json package-lock.json .next 2>/dev/null || true

            shopt -s dotglob
            for item in "$STAGE"/*; do
              name="$(basename "$item")"
              case "$name" in
                .env|dev.db|node_modules|tmp|.deploy-staging) continue ;;
                public)
                  mkdir -p "$APP_DIR/public"
                  for pub in "$item"/*; do
                    pubname="$(basename "$pub")"
                    if [ "$pubname" = "uploads" ]; then
                      mkdir -p "$APP_DIR/public/uploads"
                      cp -a "$pub"/. "$APP_DIR/public/uploads/" 2>/dev/null || true
                    else
                      rm -rf "$APP_DIR/public/$pubname"
                      cp -a "$pub" "$APP_DIR/public/$pubname"
                    fi
                  done
                  ;;
                *)
                  rm -rf "$APP_DIR/$name"
                  cp -a "$item" "$APP_DIR/$name"
                  ;;
              esac
            done
            shopt -u dotglob
            rm -rf "$STAGE"

            if [ -f /tmp/lev-env.backup ]; then mv /tmp/lev-env.backup .env; fi
            if [ -f /tmp/lev-db.backup ]; then mv /tmp/lev-db.backup dev.db; fi
            if [ ! -f .env ]; then cp .env.example .env; fi

            set +u
            for v in 22 20.20 20 22.12 18 19; do
              ACT="$HOME/nodevenv/levshawarma.com/$v/bin/activate"
              BIN="$HOME/nodevenv/levshawarma.com/$v/bin"
              if [ -f "$ACT" ]; then
                # shellcheck disable=SC1090
                . "$ACT"
                echo "Activated nodevenv $v"
                break
              elif [ -x "$BIN/node" ]; then
                export PATH="$BIN:$PATH"
                echo "Using nodevenv bin $v"
                break
              fi
            done
            set -u

            if command -v node >/dev/null 2>&1; then
              echo "Node: $(node -v)"
              cd "$APP_DIR"
              npm install --ignore-scripts
              npx prisma generate --schema=./prisma/schema.prisma || true
              npm rebuild better-sqlite3 || true
            else
              echo "WARNING: node not found; uploaded .next only. Restarting app."
            fi

            mkdir -p tmp
            touch tmp/restart.txt
            touch "$APP_DIR/tmp/restart.txt"
            if [ -d "$HOME/tmp" ]; then touch "$HOME/tmp/restart.txt" 2>/dev/null || true; fi

            rm -f "$ZIP_PATH"
            echo "Deploy finished → $APP_DIR"
