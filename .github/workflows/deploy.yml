name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project ZIP
        run: |
          set -euo pipefail

          rm -f deploy.zip

          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".next/*" \
            -x ".env" \
            -x "dev.db-*" \
            -x "*.db-journal" \
            -x "*.db-wal" \
            -x "*.db-shm" \
            -x "tmp/*" \
            -x "*.zip"

          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Unzip and deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            echo "SSH user: $(whoami)"
            echo "HOME: $HOME"
            echo "APP_DIR: $APP_DIR"

            ls -la "$HOME" || true
            ls -la "$HOME/nodevenv" || true
            find "$HOME/nodevenv" -maxdepth 5 -type f -name node 2>/dev/null || true

            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: DEPLOY_PATH secret is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: ZIP not found at $ZIP_PATH"
              exit 1
            fi

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/tmp"
            mkdir -p "$APP_DIR/public/uploads"

            NODE_BIN="/home/wmflggzahnbx/nodevenv/levshawarma.com/22/bin"

            if [ ! -d "$NODE_BIN" ]; then
              echo "ERROR: Node bin directory not found: $NODE_BIN"
              exit 1
            fi

            export PATH="$NODE_BIN:$PATH"
            hash -r

            cd "$APP_DIR"

            echo "Backing up persistent files..."

            if [ -f .env ]; then
              cp .env /tmp/lev-env.backup
            fi

            if [ -f dev.db ]; then
              cp dev.db /tmp/lev-db.backup
            fi

            if [ -f dev.db-wal ]; then
              cp dev.db-wal /tmp/lev-db-wal.backup
            fi

            if [ -f dev.db-shm ]; then
              cp dev.db-shm /tmp/lev-db-shm.backup
            fi

            echo "Removing old build..."

            rm -rf .next
            rm -rf src/generated/prisma

            echo "Extracting deployment package..."

            unzip -o "$ZIP_PATH" -d "$APP_DIR"

            echo "Restoring persistent files..."

            if [ -f /tmp/lev-env.backup ]; then
              mv /tmp/lev-env.backup "$APP_DIR/.env"
            fi

            if [ -f /tmp/lev-db.backup ]; then
              mv /tmp/lev-db.backup "$APP_DIR/dev.db"
            fi

            if [ -f /tmp/lev-db-wal.backup ]; then
              mv /tmp/lev-db-wal.backup "$APP_DIR/dev.db-wal"
            fi

            if [ -f /tmp/lev-db-shm.backup ]; then
              mv /tmp/lev-db-shm.backup "$APP_DIR/dev.db-shm"
            fi

            if [ ! -f "$APP_DIR/.env" ]; then
              if [ -f "$APP_DIR/.env.example" ]; then
                cp "$APP_DIR/.env.example" "$APP_DIR/.env"
                echo "Created .env from .env.example"
              else
                echo "ERROR: .env and .env.example do not exist"
                exit 1
              fi
            fi

            cd "$APP_DIR"

            echo "Node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "Directory: $(pwd)"

            if [ ! -f package.json ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            echo "Installing dependencies..."

            npm --prefix "$APP_DIR" install \
              --ignore-scripts \
              --include=dev

            echo "Running setup..."

            npm --prefix "$APP_DIR" run setup

            echo "Building application..."

            npm --prefix "$APP_DIR" run build

            echo "Removing development dependencies..."

            npm --prefix "$APP_DIR" prune --omit=dev

            echo "Restarting Passenger..."

            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"

            rm -f "$ZIP_PATH"

            echo "Deploy finished → $APP_DIR"