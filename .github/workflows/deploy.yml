name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_npm_install:
        description: "Also run npm install + prisma generate on the server"
        required: false
        type: boolean
        default: false
      run_build:
        description: "Also npm install + prisma generate + npm run build (needed to see code UI changes)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project ZIP (no node_modules)
        run: |
          rm -f deploy.zip
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".next/*" \
            -x ".env" \
            -x "dev.db" \
            -x "dev.db-*" \
            -x "*.zip"
          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Unzip, copy, and restart app
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_NPM_INSTALL: ${{ github.event.inputs.run_npm_install == 'true' || github.event.inputs.run_build == 'true' }}
          RUN_BUILD: ${{ github.event.inputs.run_build == 'true' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: RUN_NPM_INSTALL,RUN_BUILD
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"
            STAGE="$APP_DIR/.deploy-staging"

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_PATH secret is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ZIP not found at $ZIP_PATH"
              exit 1
            fi

            mkdir -p "$APP_DIR" "$APP_DIR/tmp" "$APP_DIR/public/uploads"
            cd "$APP_DIR"

            chmod -R u+rwX "$APP_DIR" 2>/dev/null || true

            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            unzip -o "$ZIP_PATH" -d "$STAGE"

            # Preserve production data
            if [ -f .env ]; then cp .env /tmp/lev-env.backup; fi
            if [ -f dev.db ]; then cp dev.db /tmp/lev-db.backup; fi

            # Clear old code trees that may have broken permissions from prior uploads
            rm -rf src scripts prisma server.js package.json package-lock.json 2>/dev/null || true
            chmod -R u+rwX "$APP_DIR" 2>/dev/null || true

            # Copy project files from staging (keep uploads/node_modules/.env/db/.next)
            shopt -s dotglob
            for item in "$STAGE"/*; do
              name="$(basename "$item")"
              case "$name" in
                .env|dev.db|node_modules|.next|tmp|.deploy-staging) continue ;;
                public)
                  mkdir -p "$APP_DIR/public"
                  for pub in "$item"/*; do
                    pubname="$(basename "$pub")"
                    if [ "$pubname" = "uploads" ]; then
                      mkdir -p "$APP_DIR/public/uploads"
                      cp -a "$pub"/. "$APP_DIR/public/uploads/" 2>/dev/null || true
                    else
                      rm -rf "$APP_DIR/public/$pubname"
                      cp -a "$pub" "$APP_DIR/public/$pubname"
                    fi
                  done
                  ;;
                *)
                  rm -rf "$APP_DIR/$name"
                  cp -a "$item" "$APP_DIR/$name"
                  ;;
              esac
            done
            shopt -u dotglob

            rm -rf "$STAGE"

            if [ -f /tmp/lev-env.backup ]; then mv /tmp/lev-env.backup .env; fi
            if [ -f /tmp/lev-db.backup ]; then mv /tmp/lev-db.backup dev.db; fi
            if [ ! -f .env ]; then cp .env.example .env; fi

            if [ "${RUN_NPM_INSTALL:-false}" = "true" ] || [ "${RUN_BUILD:-false}" = "true" ]; then
              echo "Installing dependencies..."
              for v in 22 20.20 20 22.12 18 19; do
                BIN="$HOME/nodevenv/levshawarma.com/$v/bin"
                if [ -x "$BIN/node" ]; then
                  export PATH="$BIN:$PATH"
                  echo "Using nodevenv bin $v"
                  break
                fi
              done

              if ! command -v node >/dev/null 2>&1; then
                echo "ERROR: node not found"
                exit 1
              fi

              echo "Node: $(node -v)"
              echo "npm: $(npm -v)"
              npm install --prefix "$APP_DIR"
              (cd "$APP_DIR" && npx prisma generate)

              if [ "${RUN_BUILD:-false}" = "true" ]; then
                echo "Building Next.js..."
                (cd "$APP_DIR" && npm run build)
              fi
            else
              echo "Skipping npm install/build (default). Restart only."
            fi
            # cPanel Node.js app restart signals
            mkdir -p tmp
            touch tmp/restart.txt
            touch "$APP_DIR/tmp/restart.txt"
            # Passenger / cPanel sometimes also watches these
            if [ -d "$HOME/tmp" ]; then touch "$HOME/tmp/restart.txt" 2>/dev/null || true; fi

            rm -f "$ZIP_PATH"
            echo "Deploy finished → $APP_DIR (restart signaled)"
