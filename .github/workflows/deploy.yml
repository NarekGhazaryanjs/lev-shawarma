name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project ZIP
        run: |
          set -euo pipefail

          rm -f deploy.zip

          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".next/*" \
            -x "tmp/*" \
            -x "*.zip"

          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -eo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_PATH is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "deploy.zip not found"
              exit 1
            fi

            APP_HOME="$(dirname "$APP_DIR")"
            APP_NAME="$(basename "$APP_DIR")"

            NODE_BIN="${{ secrets.NODE_BIN }}"

            export PATH="$NODE_BIN:$PATH"
            hash -r

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/tmp"
            mkdir -p "$APP_DIR/public"

            cd "$APP_DIR"

            echo "Backing up persistent files..."

            rm -rf /tmp/lev-env.backup
            rm -rf /tmp/lev-db.backup
            rm -rf /tmp/lev-uploads.backup

            if [ -f ".env" ]; then
              cp .env /tmp/lev-env.backup
            fi

            if [ -f "dev.db" ]; then
              cp dev.db /tmp/lev-db.backup
            fi

            if [ -d "public/uploads" ]; then
              cp -a public/uploads /tmp/lev-uploads.backup
            fi

            echo "Removing old build..."

            rm -rf .next
            rm -rf src/generated/prisma

            echo "Extracting..."

            unzip -oq "$ZIP_PATH" -d "$APP_DIR"

            echo "Restoring persistent files..."

            if [ -f /tmp/lev-env.backup ]; then
              mv /tmp/lev-env.backup .env
            fi

            if [ -f /tmp/lev-db.backup ]; then
              mv /tmp/lev-db.backup dev.db
            fi

            if [ -d /tmp/lev-uploads.backup ]; then
              rm -rf public/uploads
              mv /tmp/lev-uploads.backup public/uploads
            fi

            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              cp .env.example .env
            fi

            echo "Installing dependencies..."

            npm --prefix "$APP_DIR" install \
              --ignore-scripts

            echo "Running setup..."

            npm --prefix "$APP_DIR" run setup

            echo "Building..."

            npm --prefix "$APP_DIR" run build

            echo "Deploy completed successfully."