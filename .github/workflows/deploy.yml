name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project ZIP (no node_modules)
        run: |
          rm -f deploy.zip
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".next/*" \
            -x ".env" \
            -x "dev.db" \
            -x "dev.db-*" \
            -x "*.zip"
          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Unzip and npm install on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"
            STAGE="$APP_DIR/.deploy-staging"

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_PATH secret is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ZIP not found at $ZIP_PATH"
              exit 1
            fi

            mkdir -p "$APP_DIR" "$APP_DIR/tmp" "$APP_DIR/public/uploads"
            cd "$APP_DIR"

            # Make sure we can write over previous upload leftovers
            chmod -R u+rwX "$APP_DIR" 2>/dev/null || true

            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            unzip -o "$ZIP_PATH" -d "$STAGE"

            # Preserve production data
            if [ -f .env ]; then cp .env /tmp/lev-env.backup; fi
            if [ -f dev.db ]; then cp dev.db /tmp/lev-db.backup; fi

            # Clear old code trees that may have broken permissions from prior uploads
            rm -rf src scripts prisma server.js package.json package-lock.json 2>/dev/null || true
            chmod -R u+rwX "$APP_DIR" 2>/dev/null || true

            # Copy project files from staging (keep uploads/node_modules/.env/db)
            shopt -s dotglob
            for item in "$STAGE"/*; do
              name="$(basename "$item")"
              case "$name" in
                .env|dev.db|node_modules|.next|tmp|.deploy-staging) continue ;;
                public)
                  mkdir -p "$APP_DIR/public"
                  # copy public except uploads folder contents replacement carefully
                  for pub in "$item"/*; do
                    pubname="$(basename "$pub")"
                    if [ "$pubname" = "uploads" ]; then
                      mkdir -p "$APP_DIR/public/uploads"
                      cp -a "$pub"/. "$APP_DIR/public/uploads/" 2>/dev/null || true
                    else
                      rm -rf "$APP_DIR/public/$pubname"
                      cp -a "$pub" "$APP_DIR/public/$pubname"
                    fi
                  done
                  ;;
                *)
                  rm -rf "$APP_DIR/$name"
                  cp -a "$item" "$APP_DIR/$name"
                  ;;
              esac
            done
            shopt -u dotglob

            rm -rf "$STAGE"

            if [ -f /tmp/lev-env.backup ]; then mv /tmp/lev-env.backup .env; fi
            if [ -f /tmp/lev-db.backup ]; then mv /tmp/lev-db.backup dev.db; fi
            if [ ! -f .env ]; then cp .env.example .env; fi

            if [ -d "$HOME/nodevenv/levshawarma.com/20/bin" ]; then
              export PATH="$HOME/nodevenv/levshawarma.com/20/bin:$PATH"
            elif [ -d "$HOME/nodevenv/levshawarma.com/20.20/bin" ]; then
              export PATH="$HOME/nodevenv/levshawarma.com/20.20/bin:$PATH"
            fi

            echo "Node: $(node -v)"
            npm install
            npx prisma generate

            mkdir -p tmp
            touch tmp/restart.txt
            rm -f "$ZIP_PATH"
            echo "Deploy finished → $APP_DIR"
