name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail

          npm --prefix "$GITHUB_WORKSPACE" install \
            --ignore-scripts \
            --include=dev

      - name: Run setup
        run: |
          set -euo pipefail

          npm --prefix "$GITHUB_WORKSPACE" run setup

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail

          npm --prefix "$GITHUB_WORKSPACE" run build

      - name: Remove node_modules
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/node_modules"

      - name: Create project ZIP
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -f deploy.zip

          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "tmp/*" \
            -x "*.zip"

          echo "Deployment ZIP:"
          ls -lh deploy.zip

      - name: Upload ZIP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: /tmp/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -eo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ZIP_PATH="/tmp/deploy.zip"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: DEPLOY_PATH secret is empty"
              exit 1
            fi

            if [ ! -f "$ZIP_PATH" ]; then
              echo "ERROR: deploy.zip not found at $ZIP_PATH"
              exit 1
            fi

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/tmp"
            mkdir -p "$APP_DIR/public"

            cd "$APP_DIR"

            echo "Cleaning old backups..."

            rm -f /tmp/lev-env.backup
            rm -f /tmp/lev-db.backup
            rm -f /tmp/lev-db-wal.backup
            rm -f /tmp/lev-db-shm.backup
            rm -rf /tmp/lev-uploads.backup

            echo "Backing up persistent files..."

            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" /tmp/lev-env.backup
            fi

            if [ -f "$APP_DIR/dev.db" ]; then
              cp "$APP_DIR/dev.db" /tmp/lev-db.backup
            fi

            if [ -f "$APP_DIR/dev.db-wal" ]; then
              cp "$APP_DIR/dev.db-wal" /tmp/lev-db-wal.backup
            fi

            if [ -f "$APP_DIR/dev.db-shm" ]; then
              cp "$APP_DIR/dev.db-shm" /tmp/lev-db-shm.backup
            fi

            if [ -d "$APP_DIR/public/uploads" ]; then
              cp -a "$APP_DIR/public/uploads" /tmp/lev-uploads.backup
            fi

            echo "Removing old build..."

            rm -rf "$APP_DIR/.next"
            rm -rf "$APP_DIR/src/generated/prisma"

            echo "Extracting new deployment..."

            unzip -oq "$ZIP_PATH" -d "$APP_DIR"

            echo "Restoring persistent files..."

            if [ -f /tmp/lev-env.backup ]; then
              mv /tmp/lev-env.backup "$APP_DIR/.env"
            fi

            if [ -f /tmp/lev-db.backup ]; then
              mv /tmp/lev-db.backup "$APP_DIR/dev.db"
            fi

            if [ -f /tmp/lev-db-wal.backup ]; then
              mv /tmp/lev-db-wal.backup "$APP_DIR/dev.db-wal"
            fi

            if [ -f /tmp/lev-db-shm.backup ]; then
              mv /tmp/lev-db-shm.backup "$APP_DIR/dev.db-shm"
            fi

            if [ -d /tmp/lev-uploads.backup ]; then
              rm -rf "$APP_DIR/public/uploads"
              mv /tmp/lev-uploads.backup "$APP_DIR/public/uploads"
            fi

            if [ ! -f "$APP_DIR/.env" ]; then
              if [ -f "$APP_DIR/.env.example" ]; then
                cp "$APP_DIR/.env.example" "$APP_DIR/.env"
                echo "Created .env from .env.example"
              else
                echo "ERROR: .env and .env.example are missing"
                exit 1
              fi
            fi

            echo "Restarting Passenger..."

            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"

            rm -f "$ZIP_PATH"

            echo "Deploy completed successfully → $APP_DIR"